[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycard-benefits"
version = "0.1.0"
description = "Local-first card vault and verified benefits intelligence companion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pywin32>=308; sys_platform == 'win32'",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
keyring = ["keyring>=25,<27"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
mycard-benefits = "mycard_benefits.cli:main"
mycard-vault = "mycard_benefits.vault_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycard_benefits"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "mycard_benefits/catalog_data"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mycard_benefits"]

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true
